[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
authors = [
    { name = "Leandro Coelho", email = "leandrocerqueira2008@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-adk[db]==2.11.0",
    "google-genai>=2.28.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]

